    <path d="M 186 27 Q 188.5 38 199 40.5 Q 188.5 43 186 54 Q 183.5 43 173 40.5 Q 183.5 38 186 27 Z"/>
    <path d="M 215 37 Q 216.2 43 222 44.2 Q 216.2 45.4 215 51.4 Q 213.8 45.4 208 44.2 Q 213.8 43 215 37 Z"/>
    <path d="M 126 192 Q 129 205 142 208 Q 129 211 126 224 Q 123 211 110 208 Q 123 205 126 192 Z"/>
    <path d="M 158 195 Q 159.4 202 166 203.4 Q 159.4 204.8 158 211.4 Q 156.6 204.8 150 203.4 Q 156.6 202 158 195 Z"/>
