    <path d="M 18 92 L 31 83" stroke-width="4"/>
    <path d="M 14 107 L 29 100" stroke-width="4"/>
    <path d="M 197 187 L 210 176" stroke-width="4"/>
    <!-- the window -->
    <circle cx="108" cy="104" r="40" stroke-width="5"/>
  </g>
  <!-- the die -->
  <path d="M 74 88 L 142 88 L 108 136 Z" fill="#1A120B"/>
  <g fill="#FFFFFF" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">
    <text x="108" y="101">YOU LOOK</text>
    <text x="108" y="112">FANCY</text>
  </g>
