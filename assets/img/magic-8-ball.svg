<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="m8-title">
  <title id="m8-title">Magic 8 ball, the die reading "you look fancy"</title>
  <!-- Redrawn from the printed menu (MenuForWebsiteMARCH): line art, ink on paper. -->
  <g fill="none" stroke="#1A120B" stroke-linecap="round">
    <!-- the ball -->
    <circle cx="120" cy="122" r="78" stroke-width="6"/>
    <!-- shine, inside the rim -->
    <path d="M 57.9 99.4 A 66 66 0 0 1 102.9 58.3" stroke-width="4"/>
    <path d="M 170.6 79.6 A 66 66 0 0 1 185 110.5" stroke-width="4"/>
    <path d="M 177.2 155 A 66 66 0 0 1 131.5 187" stroke-width="4"/>
    <path d="M 62.8 155 A 66 66 0 0 1 55 133.5" stroke-width="4"/>
